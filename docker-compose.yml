version: '3.8'

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: watch-party-redis
    # Not exposed to the host — only the backend pool needs it
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: watch-party-mongo
    # Not exposed to the host — only the backend pool needs it
    volumes:
      - mongo-data:/data/db
    restart: always

  # ── Backend (multiple replicas) ─────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # No `container_name` — Compose cannot assign a fixed name to replicas.
    # No `ports` mapping — Nginx is the only public entry point.
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      # CORS origin: the host port where the frontend SPA is served
      - CLIENT_URL=http://localhost:8080
      - NODE_ENV=production
      - COOKIE_SECRET=${COOKIE_SECRET}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  # ── Nginx Load Balancer ─────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: watch-party-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always

  # ── Frontend (static SPA served by its own Nginx) ───────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - nginx
    restart: always

volumes:
  mongo-data:
  redis-data:
