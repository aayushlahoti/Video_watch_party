# ─────────────────────────────────────────────────────────────────────────────
# Watch Party — Nginx Load Balancer
#
# Sits in front of all backend replicas. Routes:
#   /api/*        →  REST API
#   /socket.io/*  →  Socket.IO (WebSocket + long-poll fallback)
#
# ip_hash ensures a client always lands on the same upstream during a TCP
# session, which is required for Socket.IO's HTTP long-polling transport.
# WebSocket upgrades are connection-level so they don't strictly need it,
# but ip_hash keeps things consistent for both transports.
# ─────────────────────────────────────────────────────────────────────────────

upstream backend_pool {
    ip_hash;

    # Docker Compose internal DNS resolves "backend" to all replica IPs.
    # Port must match the PORT env var set on the backend service (5000).
    server backend:5000;
}

server {
    listen 80;

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend_pool;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Socket.IO (WebSocket + long-poll) ────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend_pool;
        proxy_http_version 1.1;

        # Required headers for the WebSocket upgrade handshake
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive for long watch sessions
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ── Health check endpoint (used by monitoring / Docker healthcheck) ───────
    location /health {
        proxy_pass         http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Catch-all: return 404 for anything else ───────────────────────────────
    location / {
        return 404;
    }
}
